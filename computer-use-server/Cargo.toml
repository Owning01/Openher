[package]
name = "computer-use-server"
version = "0.1.0"
edition = "2021"
description = "Standalone computer-use server - harness-agnostic (Cursor/Codex/Claude/opencode) - JPEG+region+batch"
license = "MIT"

[dependencies]
enigo = "0.2"
screenshots = "0.8"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_HiDpi","Win32_Graphics_Gdi","Win32_System_Threading"] }
arboard = "3.4"

[workspace]
