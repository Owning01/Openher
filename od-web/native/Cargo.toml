[workspace]
resolver = "2"
members = ["registry-core"]

# Native migration workspace for OpenDesign.
#
# The `registry-core` crate is the compiled drop-in for the daemon's content
# registries (skills / design-systems / design-templates). It exposes the same
# surface declared in `packages/native-bridge/src/index.ts` (`RegistryBackend`)
# through an napi interface. See `registry-core/README.md` and the repo
# `native/README.md` for the wiring path. This workspace intentionally ships
# only stubs until the daemon routing is pointed at the Rust backend.
