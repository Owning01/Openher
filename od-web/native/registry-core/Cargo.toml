[package]
name = "registry-core"
version = "0.1.0"
edition = "2021"
description = "Compiled Rust backend for OpenDesign content registries (skills, design-systems, design-templates). Migration seam for apps/daemon."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["async"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
