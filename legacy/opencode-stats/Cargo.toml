[package]
name = "opencode-stats"
version = "0.2.0"
edition = "2024"
description = "OpenCode Stats — app local que lee opencode.db en solo-lectura y muestra tokens, costo y cuotas vía web local (port Rust del backend Python)"
license = "MIT"

[[bin]]
name = "opencode-stats"
path = "src/main.rs"

[[bin]]
name = "stats-watch"
path = "src/bin/stats-watch.rs"

[[bin]]
name = "make-icon"
path = "src/bin/make-icon.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
wry = "0.51"
winit = "0.30"
ureq = "2"
flate2 = "1"
# Triple-GPU stats (portable): wgpu para Intel/AMD/NVIDIA (Vulkan/D3D12), arrow para columnar, rayon para CPU fallback
wgpu = { version = "24", optional = true }
arrow = { version = "53", optional = true, features = ["prettyprint"] }
rayon = { version = "1", optional = true }
pollster = { version = "0.4", optional = true }
# CUDA opcional solo NVIDIA (PTX via cudarc) — driver feature auto-detecta toolkit
cudarc = { version = "0.11", optional = true }

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:arrow", "dep:rayon", "dep:pollster"]
cuda = ["gpu", "dep:cudarc"]
# aliases para compatibilidad triple (mismo wgpu, diferente vendor detectado en runtime)
intel = ["gpu"]
amd = ["gpu"]
cuda-full = ["cuda"]

[build-dependencies]
embed-resource = "2"

[dev-dependencies]
tempfile = "3"
