name: CI — Build & Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web (build + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      - name: Build
        run: pnpm build
        working-directory: web

      - name: i18n regression
        run: pnpm test:i18n
        working-directory: web

      - name: UI regression
        run: pnpm test:ui
        working-directory: web

      - name: Settings regression
        run: pnpm test:settings
        working-directory: web

      - name: Model regression
        run: pnpm test:model
        working-directory: web

      - name: Rendered regression
        run: pnpm test:rendered
        working-directory: web

  rust:
    name: Desktop workspace (check + clippy)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  desktop-agent:
    name: Desktop agent (Go vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Go vet
        run: go vet ./...
        working-directory: desktop-agent
