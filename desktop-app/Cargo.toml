[package]
name = "opencode-desktop"
version = "0.1.0"
edition = "2021"
description = "OpenCode Desktop - shell Rust portable que embebe la web app, stats, terminales, explorador y plugins"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wry = "0.51"
winit = "0.30"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.19"
portable-pty = "0.8"
ureq = "2"
winreg = "0.52"
sha1 = "0.10"
opencode-stats = { path = "../../opencode-stats" }

[profile.release]
strip = true
lto = true
codegen-units = 1

[build-dependencies]
winresource = "0.1"
