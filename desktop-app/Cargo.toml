[package]
name = "opencode-desktop"
version = "0.1.0"
edition = "2021"
description = "OpenHer Desktop - shell Rust portable que embebe la web app, stats, terminales, explorador y plugins"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12" # se mantiene para fallback; hyper es el path nuevo
wry = { version = "0.51", features = ["devtools"] }
winit = "0.30"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }
tray-icon = "0.19"
rfd = "0.15"
portable-pty = "0.8"
ureq = "2"
winreg = "0.52"
sha1 = "0.10"
crossbeam-channel = "0.5"
pdf-extract = "0.7"
lopdf = "0.34"
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
opencode-stats = { path = "../opencode-stats" }
comrak = "0.29"
headless_chrome = "1.0"
base64 = "0.22"
# Velocidad plan §3.1-3.8
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
memmap2 = "0.9"
simd-json = { version = "0.14", features = ["serde_impl"] }
rayon = "1"
rtrb = "0.3"
notify = { version = "6", features = ["macos_kqueue"] }

[build-dependencies]
winresource = "0.1"
